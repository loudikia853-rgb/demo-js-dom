<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Démo — DOM et événements</title>
  <style>
    :root{--bg:#f1f5f9;--fg:#0f172a;--card:#fff;--accent:#0284c7;--border:#cbd5e1}
    body.nuit{--bg:#0f172a;--fg:#e2e8f0;--card:#1e293b;--accent:#38bdf8;--border:#475569}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:1.5rem}
    header{text-align:center;margin-bottom:1.2rem}
    main{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:1000px;margin:auto}
    .carte{background:var(--card);border:1px solid var(--border);border-radius:.7rem;padding:1rem}
    h1{color:var(--accent)}
    h2{font-size:1.05rem;margin-top:0}
    input,select,button{font:inherit;padding:.4rem .6rem;border:1px solid var(--border);border-radius:.35rem;margin:.25rem 0}
    input,select{display:block;width:100%;background:var(--card);color:var(--fg)}
    button{background:var(--accent);color:#fff;border:0;cursor:pointer}
    #affichage,#message,#indice{font-weight:600;color:var(--accent)}
    .erreur{color:#dc2626}.succes{color:#16a34a}
  </style>
</head>
<body>
  <header>
    <h1 id="titre">Tableau de bord</h1>
    <p>ABDERRAHMANE LOUDIKI · S5 IA</p>
  </header>

  <main>
    <section class="carte" id="carte-titre">
      <h2>Apparence</h2>
      <button id="btn-titre" type="button">Modifier le titre</button>
      <button id="btn-couleur" type="button">Basculer le thème</button>
    </section>

    <section class="carte" id="carte-texte">
      <h2>Saisie</h2>
      <label for="saisie">Votre texte</label>
      <input id="saisie" type="text" placeholder="Écrivez ici…">
      <p id="affichage">Aucun texte saisi.</p>
    </section>

    <section class="carte" id="carte-compteur">
      <h2>Compteur</h2>
      <p>Nombre de clics : <strong id="compteur">0</strong></p>
      <button id="btn-compteur" type="button">Cliquez-moi</button>
    </section>

    <section class="carte" id="carte-form">
      <h2>Inscription</h2>
      <form id="formulaire" novalidate>
        <label for="nom">Nom</label>
        <input id="nom" name="nom" type="text" placeholder="Votre nom">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="nom@exemple.com">
        <button type="submit">Valider</button>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="carte">
      <h2>Préférences</h2>
      <label for="theme">Thème</label>
      <select id="theme">
        <option value="clair">Clair</option>
        <option value="nuit">Nuit</option>
      </select>
      <p id="indice">Survolez la carte Compteur.</p>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let clics = 0;

    $('btn-titre').addEventListener('click', () => {
      $('titre').textContent = 'Tableau de bord mis à jour';
    });

    $('btn-couleur').addEventListener('click', () => {
      const nuit = document.body.classList.toggle('nuit');
      $('theme').value = nuit ? 'nuit' : 'clair';
    });

    $('saisie').addEventListener('input', e => {
      $('affichage').textContent = e.target.value || 'Aucun texte saisi.';
    });

    $('theme').addEventListener('change', e => {
      document.body.classList.toggle('nuit', e.target.value === 'nuit');
    });

    $('btn-compteur').addEventListener('click', () => {
      $('compteur').textContent = ++clics;
    });

    $('carte-compteur').addEventListener('mouseover', () => {
      $('indice').textContent = 'Survol détecté ✅';
    });

    $('formulaire').addEventListener('submit', e => {
      e.preventDefault();
      const nom = $('nom').value.trim();
      const email = $('email').value.trim();
      const msg = $('message');
      if (nom.length < 2 || !email.includes('@') || !email.includes('.')) {
        msg.textContent = 'Erreur : nom (2 caractères min.) et e-mail valide requis.';
        msg.className = 'erreur';
      } else {
        msg.textContent = `Formulaire valide, merci ${nom} !`;
        msg.className = 'succes';
      }
    });
  </script>
</body>
</html>
